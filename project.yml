name: Herdie

options:
  bundleIdPrefix: com.lucasscariot
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  Herdie:
    type: application
    platform: iOS
    sources:
      - path: Herdie
      - path: Generated/HerdieCore/herdie_core.swift
        group: Generated
    resources:
      - path: Herdie/Resources/Assets.xcassets
      - path: Herdie/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - framework: Frameworks/HerdieCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasscariot.herdie
        PRODUCT_NAME: Herdie
        INFOPLIST_FILE: Herdie/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      testTargets:
        - HerdieTests
        - HerdieUITests
      gatherCoverageData: true

  HerdieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HerdieTests
    dependencies:
      - target: Herdie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasscariot.herdie.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Herdie.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Herdie"
        BUNDLE_LOADER: "$(TEST_HOST)"

  HerdieUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HerdieUITests
    dependencies:
      - target: Herdie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasscariot.herdie.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Herdie
